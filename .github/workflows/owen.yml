name: Owen replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installed-owen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash examples/check_owen_wheel.sh
  independent-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate request-only controls
        run: |
          PYTHONPATH=. python examples/make_owen_controls.py
          git diff --exit-code -- docs/owen-data.js
      - name: Independent JavaScript and actual Chrome, old and new
        run: node --test tests/*.cjs
